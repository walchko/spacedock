[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cool_project_name"
version = "2025.03.02"
description = "Some simple description"
authors = [{ name="walchko", email="walchko@users.noreply.github.com" }]
readme = "readme.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ['key', 'words']
classifiers = [
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
]

dependencies = [
    "colorama",
    "serial>1.0"
]

[project.optional-dependencies]
pdf = ["ReportLab>=1.2", "RXP"]
rest = ["docutils>=0.3", "pack ==1.1, ==1.3"]

[project.scripts]
my-script = "cool_project_name.module:function"

[project.urls]
Homepage = "https://pypi.org/project/cool_project_name/"
Repository = "https://github.com/walchko/cool_project_name"


[tool.setuptools.packages.find]
where = ["."]
include = ["cool_project_name*"]

[tool.marimo.runtime]
pythonpath = ["."]
